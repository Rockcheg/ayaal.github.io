<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Органайзер и интерьер</title>
  <desc id="desc">Фирменная заглушка в графитово-золотом стиле.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282b31"/>
      <stop offset="100%" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efd7a3"/>
      <stop offset="100%" stop-color="#b88e43"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="88" y="88" width="1024" height="574" rx="44" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
  <text x="115" y="218" fill="#f8edcf" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">ОРГАНАЙЗЕР</text>
  <text x="115" y="292" fill="#d4c7ad" font-family="Inter, Arial, sans-serif" font-size="33">Салон / багажник / хранение</text>
  <rect x="165" y="360" width="870" height="196" rx="28" fill="#f7f1e5"/>
  <g stroke="#b88e43" stroke-width="5" fill="none" opacity="0.85">
    <rect x="222" y="405" width="220" height="106" rx="16"/>
    <rect x="492" y="405" width="220" height="106" rx="16"/>
    <rect x="762" y="405" width="220" height="106" rx="16"/>
  </g>
</svg>
